name: Qualidade

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Migrations, verificacoes e build
    timeout-minutes: 35
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cmdca_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmdca_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/cmdca_test?sslmode=disable
      DATABASE_URI_UNPOOLED: postgresql://postgres:postgres@localhost:5432/cmdca_test?sslmode=disable
      ENFORCE_PRODUCTION_ENV: 'false'
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      MEDIA_DIR: ${{ github.workspace }}/ci-media
      PAYLOAD_SECRET: quality-only-payload-secret-with-at-least-thirty-two-characters

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar pnpm 11.15.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
          run_install: false

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validar versoes
        run: node scripts/ci-validate-versions.mjs

      - name: Instalar dependencias pelo lockfile
        run: pnpm install --frozen-lockfile --prod=false

      - name: Aplicar migrations no PostgreSQL efemero
        run: pnpm migrate

      - name: Preparar pasta de midia compartilhada com o container
        run: mkdir -p "$MEDIA_DIR" test-results && chmod 777 "$MEDIA_DIR"

      - name: Verificar CMS e permissoes no banco isolado
        timeout-minutes: 5
        run: pnpm exec tsx scripts/ci-test-cms.ts

      - name: Aplicar pacote editorial no banco isolado
        timeout-minutes: 5
        run: |
          export APPLY_CONTENT_PACK=true CONTENT_PACK_AUTHOR_EMAIL=editor@example.test
          pnpm apply:content-pack | tee test-results/content-pack-1.log
          grep -q 'CONTENT_PACK_CREATED=19' test-results/content-pack-1.log
          pnpm apply:content-pack | tee test-results/content-pack-2.log
          grep -q 'CONTENT_PACK_CREATED=0' test-results/content-pack-2.log

      - name: Executar verificacoes de qualidade
        run: |
          git diff --check
          pnpm check

      - name: Gerar build com banco migrado
        run: |
          pnpm build
          node scripts/ci-check-artifact.mjs

      - name: Publicar noticia depois do build
        # Como na VPS: o conteúdo real não está no build e precisa aparecer no 1º acesso.
        run: pnpm exec tsx scripts/ci-post-build-news.ts

      - name: Montar imagem de execucao sem compilar na VPS
        run: docker build --tag cmdca-quality:${{ github.sha }} .

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verificar paginas e login no artefato de producao
        run: |
          mkdir -p test-results
          # A mídia vive em disco, como na VPS: o runner (fixtures) e o container
          # compartilham a mesma pasta, montada onde a imagem espera (/app/media).
          docker run --detach --name cmdca-quality --network host \
            -v "$MEDIA_DIR:/app/media" \
            -e DATABASE_URI -e DATABASE_URI_UNPOOLED -e PAYLOAD_SECRET \
            -e NEXT_PUBLIC_SERVER_URL -e ENFORCE_PRODUCTION_ENV -e GITHUB_ACTIONS \
            -e LOGIN_RATE_LIMIT_MAX=1000 \
            cmdca-quality:${{ github.sha }}
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/api/health >/dev/null ||
            { echo '::error::O container não ficou saudável em 120 s'; docker logs cmdca-quality | tail -50; exit 1; }
          # 1º acesso à home: a versão do build (sem a notícia) não pode ser servida.
          curl -sf http://localhost:3000/ | grep -q 'ci-noticia-depois-do-build' ||
            { echo '::error::A home serviu o HTML do build em vez do conteúdo do banco'; exit 1; }
          node scripts/ci-smoke-production.mjs
          pnpm exec playwright test
          node scripts/ci-audit-admin.mjs
          AUDIT_NEWS=true AUDIT_INCLUDE_ADMIN=false node scripts/audit-portal.mjs
        env:
          SMOKE_BASE_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Guardar diagnostico do container
        if: always()
        run: |
          mkdir -p test-results
          docker logs cmdca-quality > test-results/server.log 2>&1 || true
          docker inspect --format '{{json .State}}' cmdca-quality > test-results/container-state.json || true

      - name: Guardar evidencias do navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-browser
          path: test-results/
          retention-days: 14
