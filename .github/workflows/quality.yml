name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Migrations, verificacoes e build
    timeout-minutes: 35
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cmdca_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cmdca_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/cmdca_test?sslmode=disable
      DATABASE_URI_UNPOOLED: postgresql://postgres:postgres@localhost:5432/cmdca_test?sslmode=disable
      ENFORCE_PRODUCTION_ENV: "false"
      NEXT_PUBLIC_R2_PUBLIC_URL: https://media.example.test
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_SECRET: quality-only-payload-secret-with-at-least-thirty-two-characters
      S3_ACCESS_KEY_ID: quality-only-access-key
      S3_BUCKET: cmdca-quality
      S3_ENDPOINT: https://r2.example.test
      S3_REGION: auto
      S3_SECRET_ACCESS_KEY: quality-only-secret-key

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar pnpm 11.15.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0
          run_install: false

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validar versoes
        run: node scripts/ci-validate-versions.mjs

      - name: Instalar dependencias pelo lockfile
        run: pnpm install --frozen-lockfile --prod=false

      - name: Aplicar migrations no PostgreSQL efemero
        run: pnpm migrate

      - name: Verificar CMS e permissoes no banco isolado
        timeout-minutes: 5
        run: pnpm exec tsx scripts/ci-test-cms.ts

      - name: Executar verificacoes de qualidade
        run: |
          git diff --check
          pnpm check

      - name: Gerar build com banco migrado
        run: |
          pnpm build
          node scripts/ci-check-artifact.mjs

      - name: Montar imagem de execucao sem compilar na VPS
        run: docker build --tag cmdca-quality:${{ github.sha }} .

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verificar paginas e login no artefato de producao
        run: |
          mkdir -p test-results
          docker run --detach --name cmdca-quality --network host \
            -e DATABASE_URI -e DATABASE_URI_UNPOOLED -e PAYLOAD_SECRET \
            -e NEXT_PUBLIC_SERVER_URL -e NEXT_PUBLIC_R2_PUBLIC_URL \
            -e S3_BUCKET -e S3_ENDPOINT -e S3_REGION -e S3_ACCESS_KEY_ID \
            -e S3_SECRET_ACCESS_KEY -e ENFORCE_PRODUCTION_ENV -e GITHUB_ACTIONS \
            cmdca-quality:${{ github.sha }}
          node scripts/ci-smoke-production.mjs
          pnpm exec playwright test
          node scripts/ci-audit-admin.mjs
          AUDIT_NEWS=true AUDIT_INCLUDE_ADMIN=false node scripts/audit-portal.mjs
        env:
          SMOKE_BASE_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Guardar diagnostico do container
        if: always()
        run: |
          mkdir -p test-results
          docker logs cmdca-quality > test-results/server.log 2>&1 || true
          docker inspect --format '{{json .State}}' cmdca-quality > test-results/container-state.json || true

      - name: Guardar evidencias do navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-browser
          path: test-results/
          retention-days: 14
