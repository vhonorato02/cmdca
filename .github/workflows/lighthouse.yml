name: Lighthouse (producao)

# Mede o site publicado em hardware padronizado do GitHub (Lighthouse mobile, 3 rodadas
# por página, mediana). Roda depois do E2E de produção (para não medir com o E2E
# carregando o servidor), toda segunda-feira e sob demanda.
on:
  workflow_run:
    workflows: ['E2E (producao)']
    types: [completed]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    # O E2E só roda depois de deploy verde; mede mesmo se o E2E falhar.
    if: >-
      github.event_name != 'workflow_run' ||
      contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE: ${{ vars.CMDCA_PUBLIC_URL }}
      PAGES: '/ /ajuda /fmdca /noticias /conselho /reunioes /resolucoes /participe'
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Medir
        run: |
          mkdir -p lh
          npm i -g lighthouse@12 >/dev/null
          for p in $PAGES; do
            n=$(echo "${p#/}" | tr '/' '_'); n=${n:-home}
            for i in 1 2 3; do
              # O Chrome do runner às vezes perde o início da navegação (NO_NAVSTART):
              # repete até 3 vezes para ter 3 rodadas válidas por página.
              for tentativa in 1 2 3; do
                lighthouse "$BASE$p" --quiet --chrome-flags='--headless=new --no-sandbox' \
                  --output=json --output-path="lh/$n-$i.json" || true
                node -e "process.exit(require('./lh/$n-$i.json').runtimeError ? 1 : 0)" 2>/dev/null && break
              done
            done
          done
      - name: Resumo (mediana de 3, mínimo 95)
        shell: bash # com pipefail: o tee não pode esconder a falha do resumo
        env:
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
        run: node scripts/lighthouse-summary.mjs lh 95 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-mobile
          path: lh/
          retention-days: 30
