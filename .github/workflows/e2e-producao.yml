name: E2E (producao)

# Testes de leitura e axe contra o site publicado, em desktop e celular. Não usa
# credenciais nem cria dados: os testes que dependem das fixtures do CI são pulados
# (E2E_TARGET=production). Roda depois de cada deploy e sob demanda.
on:
  workflow_run:
    workflows: ['Producao (VPS)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmdca-e2e-production
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.CMDCA_PUBLIC_URL }}
      E2E_TARGET: production
    steps:
      - uses: actions/checkout@v4
        with:
          # Testes do commit publicado, não do último push (podem estar na fila).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with: { version: 11.15.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright contra a produção
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-producao
          path: test-results/
          retention-days: 30
