# pnpm 10+ guarda aqui as deps autorizadas a rodar build scripts
# (sharp/esbuild precisam disso para baixar/linkar seus binarios nativos).
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Patches transitivos de segurança ainda não incorporados por todas as
# dependências do Payload. Remover quando o upstream passar a resolver versões
# iguais ou superiores.
overrides:
  dompurify: 3.4.11
  esbuild: 0.28.1
  postcss: 8.5.10
