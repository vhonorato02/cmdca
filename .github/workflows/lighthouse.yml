name: Lighthouse (producao)

# Mede o site publicado em hardware padronizado do GitHub (Lighthouse mobile, 3 rodadas
# por página, mediana). Roda depois de cada deploy, toda segunda-feira e sob demanda.
on:
  workflow_run:
    workflows: ['Producao (VPS)']
    types: [completed]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ vars.CMDCA_PUBLIC_URL }}
      PAGES: '/ /ajuda /fmdca /noticias /conselho /reunioes /resolucoes /participe'
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Medir
        run: |
          mkdir -p lh
          npm i -g lighthouse@12 >/dev/null
          for p in $PAGES; do
            n=$(echo "${p#/}" | tr '/' '_'); n=${n:-home}
            for i in 1 2 3; do
              lighthouse "$BASE$p" --quiet --chrome-flags='--headless=new --no-sandbox' \
                --output=json --output-path="lh/$n-$i.json" || true
            done
          done
      - name: Resumo (mediana de 3, mínimo 95)
        env:
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
        run: node scripts/lighthouse-summary.mjs lh 95 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-mobile
          path: lh/
          retention-days: 30
